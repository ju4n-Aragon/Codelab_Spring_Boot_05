spring.application.name=cliente-service
server.port=8080

# Versión de la API (se usa en /api/${api.version}/cliente-service)
api.version=v1

# Persistencia: H2 embebido en modo compatibilidad PostgreSQL (no requiere Docker ni red)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea el esquema y ejecuta src/main/resources/import.sql (regiones iniciales)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Nunca exponer el stacktrace al cliente
server.error.include-stacktrace=never
server.error.include-message=never

# Logs: WARN (404), ERROR (500), DEBUG (validaciones)
logging.level.root=INFO
logging.level.com.denkitronik.clienteservice=DEBUG
